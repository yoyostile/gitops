---
name: Lint

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Currently no way to detect automatically
  DEFAULT_BRANCH: main

permissions:
  contents: read

jobs:
  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check flake
        run: nix flake check ./nix --all-systems

  build:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint
        uses: super-linter/super-linter/slim@v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
          DEFAULT_BRANCH: "${{ env.DEFAULT_BRANCH }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          ANSIBLE_CONFIG_FILE: .ansible-lint
          MARKDOWN_CONFIG_FILE: .markdownlint.yaml
          TERRAFORM_TFLINT_CONFIG_FILE: .tflint.hcl
          YAML_CONFIG_FILE: .yamllint.yaml
          # super-linter runs a bare `prettier`, so it never finds the configs
          # under .github/linters unless they are passed explicitly.
          PRETTIER_COMMAND_OPTIONS: >-
            --config .github/linters/.prettierrc.yaml
            --ignore-path .github/linters/.prettierignore
          # `permissions: contents: read` cannot write commit statuses or
          # comments, and neither is worth widening the token for.
          MULTI_STATUS: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          # Prettier is this repo's formatter; biome disagrees with it on the
          # same files, including the generated Brewfile.lock.json.
          VALIDATE_BIOME_FORMAT: false
          # Whole-tree Kubernetes misconfiguration scanning, same class as
          # Checkov above. Hardening the manifests is its own piece of work.
          VALIDATE_TRIVY: false
          # textlint's terminology preset rejects "repo", "id" and similar
          # wording this repo has always used.
          VALIDATE_NATURAL_LANGUAGE: false
          KUBERNETES_KUBECONFORM_OPTIONS: >-
            --ignore-missing-schemas
            -ignore-filename-pattern '.*\.sops\.ya?ml$'

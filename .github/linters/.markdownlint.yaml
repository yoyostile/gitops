---
default: true

# MD013/line-length - Line length
MD013:
  # Number of characters
  line_length: 240
  # Number of characters for headings
  heading_line_length: 80
  # Number of characters for code blocks. Matches line_length: this repo's
  # examples are long kubectl/sops/qm one-liners that must stay copy-pasteable.
  code_block_line_length: 240
  # Include code blocks
  code_blocks: true
  # Include tables
  tables: true
  # Include headings
  headings: true
  # Include headings
  headers: true
  # Strict length checking
  strict: false
  # Stern length checking
  stern: false

# MD024/no-duplicate-heading - Long docs repeat a section name under an appendix
# parent, which is not a real duplicate.
MD024:
  siblings_only: true

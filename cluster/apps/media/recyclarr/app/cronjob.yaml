---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  schedule: "0 5 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
              args: ["sync"]
              envFrom:
                - secretRef:
                    name: recyclarr
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                # Recyclarr clones the guides into /config on every run; only the
                # config itself comes from Git.
                - name: data
                  mountPath: /config
                - name: config
                  mountPath: /config/configs
                  readOnly: true
          volumes:
            - name: data
              emptyDir: {}
            - name: config
              configMap:
                name: recyclarr-config

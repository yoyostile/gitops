# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
radarr:
  radarr:
    base_url: http://radarr.media.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 79faa9943cef2f510b997b1f2a9f3ea6 # [German] Remux + WEB 2160p
        name: Remux + WEB 2160p (GER)
        reset_unmatched_scores:
          enabled: true
        # The guide allows 2160p only. 1080p as a separate, lower quality let an
        # English 2160p release replace a German 1080p one. In one group the CF
        # score decides, and the German boosters rank German above resolution.
        qualities:
          - name: Merged QPs
            qualities:
              - Remux-2160p
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - Remux-1080p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
        upgrade:
          allowed: true
          until_quality: Merged QPs
          # German DL + German 2160p Booster. The guide's 35000 is unreachable,
          # so with a minimum step of 1 every REPACK replaced a 60 GB remux.
          until_score: 20000
        min_upgrade_format_score: 1000

      # Kids content: German is mandatory (German 10000, German DL 11000),
      # resolution is secondary, nothing above 1080p.
      - trash_id: 2b90e905c99490edc7c7a5787443748b # [German] HD Bluray + WEB
        name: Kinder (GER)
        reset_unmatched_scores:
          enabled: true
        min_format_score: 10000
        qualities:
          - name: HD
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
        upgrade:
          allowed: true
          until_quality: HD
          # German + German 1080p Booster + 1080p: the first German 1080p release
          # ends upgrades.
          until_score: 10700
        min_upgrade_format_score: 500

      # Assigned per user by a Seerr override rule. Capped at 1080p to save disk.
      # English matters more than German here: DE+EN > EN > DE only (fallback).
      - trash_id: 2b90e905c99490edc7c7a5787443748b # [German] HD Bluray + WEB
        name: HD (EN+DE)
        reset_unmatched_scores:
          enabled: true
        # German-only dubs score -10000 (see custom_formats) and stay a fallback.
        min_format_score: -10000
        qualities:
          - name: HD
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
        upgrade:
          allowed: true
          until_quality: HD
          # German DL + German 1080p Booster + 1080p.
          until_score: 11700
        min_upgrade_format_score: 1000

    custom_formats:
      - trash_ids:
          - 86bc3115eb4e9873ac96904a4a68e19e # German (German dub without the original audio)
        assign_scores_to:
          - name: HD (EN+DE)
            score: -10000

    # No Golden Rule: its x265 formats score -35000 and would reject German x265
    # encodes, which are common at 1080p.
    custom_format_groups:
      add:
        - trash_id: 0ca61b4b233178d07113082a7acff72d # [Unwanted] Unwanted Formats German
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
      skip:
        - ff204bbcecdd487d1cefcefdbf0c278d # [Optional] Golden Rule UHD
        - f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
        # Audio scores (up to +5000) would trigger upgrades for a better audio track.
        - 9d5acd8f1da78dfbae788182f7605200 # [Audio] Audio Formats

sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 08cececf1840290f6fd490b7d79e8642 # [German] UHD Remux + WEB
        name: UHD Remux + WEB (GER)
        reset_unmatched_scores:
          enabled: true
        # Same reasoning as Radarr. HDTV stays allowed here because German TV
        # recordings are sometimes the only German source for a series.
        qualities:
          - name: Merged QPs
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - HDTV-2160p
              - Bluray-1080p Remux
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
        upgrade:
          allowed: true
          until_quality: Merged QPs
          until_score: 20000
        min_upgrade_format_score: 1000

      # Same rules as the Radarr kids profile.
      - trash_id: dca7e5e9e99c703bcbdaaa471dd40e98 # [German] HD Bluray + WEB
        name: Kinder (GER)
        reset_unmatched_scores:
          enabled: true
        min_format_score: 10000
        qualities:
          - name: HD
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
        upgrade:
          allowed: true
          until_quality: HD
          until_score: 10700
        min_upgrade_format_score: 500

      # Same rules as the Radarr "HD (EN+DE)" profile.
      - trash_id: dca7e5e9e99c703bcbdaaa471dd40e98 # [German] HD Bluray + WEB
        name: HD (EN+DE)
        reset_unmatched_scores:
          enabled: true
        min_format_score: -10000
        qualities:
          - name: HD
            qualities:
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
        upgrade:
          allowed: true
          until_quality: HD
          until_score: 11700
        min_upgrade_format_score: 1000

    custom_formats:
      - trash_ids:
          - 8a9fcdbb445f2add0505926df3bb7b8a # German
        assign_scores_to:
          - name: HD (EN+DE)
            score: -10000

    custom_format_groups:
      add:
        - trash_id: 6f0872eebfc95b1f93474b7ac866ced0 # [Unwanted] Unwanted Formats German
        - trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
      skip:
        - e3f37512790f00d0e89e54fe5e790d1c # [Optional] Golden Rule UHD
        - 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD

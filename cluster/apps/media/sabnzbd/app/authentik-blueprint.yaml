---
# authentik provider/application for this app, applied by authentik's
# blueprint worker. Mounted read-only into the authentik worker, so it
# must live in the `default` namespace even when the app does not.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-sabnzbd
  namespace: default
data:
  sabnzbd.yaml: |
    version: 1
    metadata:
      name: Sabnzbd (gitops)
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Provider for Sabnzbd
        attrs:
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          basic_auth_enabled: false
          external_host: https://sabnzbd.${SECRET_LAB_DOMAIN}
          intercept_header_auth: true
          internal_host: http://sabnzbd.media.svc.cluster.local:8080
          internal_host_ssl_validation: false
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: Proxy outpost']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: Application Entitlements']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''openid''']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''email''']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''profile''']]
          refresh_token_validity: days=30
          skip_path_regex: ^/api(/.*)?$
      - model: authentik_core.application
        state: present
        identifiers:
          slug: sabnzbd
        attrs:
          meta_hide: false
          name: Sabnzbd
          open_in_new_tab: false
          policy_engine_mode: any
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for Sabnzbd]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, sabnzbd]]
          order: 0
          user: !Find [authentik_core.user, [username, yoyostile]]
        attrs:
          enabled: true
          negate: false
          failure_result: false
          timeout: 30

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: romm
  namespace: media
  annotations:
    hajimari.io/enable: "true"
    hajimari.io/icon: "gamepad-variant"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "networking-internal-ips-only@kubernetescrd"
    external-dns/internal: "true"
spec:
  ingressClassName: traefik-internal
  tls:
    - secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
      hosts:
        - romm.${SECRET_LAB_DOMAIN}
  rules:
    - host: romm.${SECRET_LAB_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: romm
                port:
                  name: http

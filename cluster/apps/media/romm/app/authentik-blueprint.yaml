---
# Declare client_secret because RomM reads the same substituted value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-romm
  namespace: default
data:
  romm.yaml: |
    version: 1
    metadata:
      name: RomM (gitops)
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # RomM rejects logins with email_verified false, which the stock email
      # mapping hardcodes, and has no switch to skip the check.
      - model: authentik_providers_oauth2.scopemapping
        state: present
        id: romm-email-verified
        identifiers:
          name: "RomM: OpenID 'email' (verified)"
        attrs:
          scope_name: email
          description: Email address (verified)
          expression: |
            return {"email": request.user.email, "email_verified": True}
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Provider for RomM
        attrs:
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          client_id: "${ROMM_OAUTH_CLIENT_ID}"
          client_secret: "${ROMM_OAUTH_CLIENT_SECRET}"
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          include_claims_in_id_token: true
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          issuer_mode: per_provider
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''openid''']]
            - !KeyOf romm-email-verified
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''profile''']]
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://romm.${SECRET_LAB_DOMAIN}/api/oauth/openid
          refresh_token_validity: days=30
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
      # Must match the slug in OIDC_SERVER_APPLICATION_URL.
      - model: authentik_core.application
        state: present
        identifiers:
          slug: romm
        attrs:
          meta_hide: false
          meta_launch_url: https://romm.${SECRET_LAB_DOMAIN}
          name: RomM
          open_in_new_tab: false
          policy_engine_mode: any
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for RomM]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, romm]]
          order: 0
          user: !Find [authentik_core.user, [username, yoyostile]]
        attrs:
          enabled: true
          negate: false
          failure_result: false
          timeout: 30

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://kubernetes-sigs.github.io/node-feature-discovery/charts
      chart: node-feature-discovery
      version: 0.19.0
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery-charts
        namespace: flux-system
      interval: 5m

  install:
    createNamespace: true
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    image:
      repository: registry.k8s.io/nfd/node-feature-discovery
    nodeFeatureRule:
      createCRD: true

  # NixOS: /lib/modules is an absolute symlink that dangles inside the
  # container, so kernel.enabledmodule (needs modules.builtin) never appears.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: node-feature-discovery-worker
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: node-feature-discovery-worker
              spec:
                template:
                  spec:
                    volumes:
                      - name: host-lib
                        hostPath:
                          path: /run/booted-system/kernel-modules/lib

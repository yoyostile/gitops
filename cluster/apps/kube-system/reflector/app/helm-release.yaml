---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: kube-system
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: reflector
    namespace: kube-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    configuration:
      logging:
        minimumLevel: Debug
    resources:
      requests:
        cpu: 10m
        memory: 384Mi
      limits:
        memory: 768Mi

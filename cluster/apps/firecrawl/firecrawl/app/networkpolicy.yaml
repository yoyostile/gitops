---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: firecrawl
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: firecrawl
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The API, queues, database, and browser service communicate only inside this
# namespace. No component is exposed through an Ingress or LoadBalancer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-components
  namespace: firecrawl
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-clients
  namespace: firecrawl
spec:
  podSelector:
    matchLabels:
      app: firecrawl-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: open-webui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: traefik-internal-networking
      ports:
        - protocol: TCP
          port: 3002
---
# /v1/search proxies through SearXNG. allow-public-web cannot cover this: it
# excludes 10.0.0.0/8, which contains the cluster service and pod CIDRs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-searxng
  namespace: firecrawl
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - firecrawl-api
          - firecrawl-worker
          - firecrawl-nuq-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: searxng
      ports:
        - protocol: TCP
          port: 8080
---
# Scraping is restricted to public HTTP(S) destinations. This prevents a URL
# supplied to an agent from turning Firecrawl into a path to the homelab LAN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-web
  namespace: firecrawl
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - firecrawl-api
          - firecrawl-worker
          - firecrawl-nuq-worker
          - firecrawl-playwright
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            # jscpd:ignore-start
            except:
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      # jscpd:ignore-end
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

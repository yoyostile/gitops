---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configMapGenerator:
  - name: cnpg-dashboard
    files:
      - cnpg-dashboard.json=https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/refs/heads/main/charts/cluster/grafana-dashboard.json
  # All dashboards are generated rather than inlined: generatorOptions disables
  # Flux substitution, so Grafana's $instance/$__range vars need no $$ escaping.
  - name: host-temperatures-dashboard
    files:
      - host-temperatures.json
  - name: main-dashboard
    files:
      - main.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    grafana_dashboard: "1"

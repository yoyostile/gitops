---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uptime-redirect
  namespace: monitoring
spec:
  redirectRegex:
    regex: ^https?://uptime\.[^/]+/(.*)
    replacement: https://gatus.${SECRET_LAB_DOMAIN}/$${1}
    permanent: true
---
# No authentik middleware here: redirect first, the gatus ingress handles auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-redirect
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    external-dns.kubernetes.io/target: "${SECRET_CLOUDFLARE_TUNNEL_DOMAIN}"
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "networking-cloudflarewarp@kubernetescrd,monitoring-uptime-redirect@kubernetescrd"
    external-dns/external: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - uptime.${SECRET_LAB_DOMAIN}
      secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
  rules:
    - host: uptime.${SECRET_LAB_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatus
                port:
                  number: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokeping-app
  namespace: monitoring
  labels:
    app.kubernetes.io/name: smokeping
    app.kubernetes.io/instance: smokeping
spec:
  replicas: 1
  # Recreate prevents Multi-Attach with the ReadWriteOnce volumes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smokeping
      app.kubernetes.io/instance: smokeping
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smokeping
        app.kubernetes.io/instance: smokeping
    spec:
      nodeSelector:
        topology.kubernetes.io/region: lab
      containers:
        - name: smokeping
          image: ghcr.io/linuxserver/smokeping:version-2.7.3-r5
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: smokeping-app
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: smokeping-config-ceph
        - name: data
          persistentVolumeClaim:
            claimName: smokeping-data-ceph

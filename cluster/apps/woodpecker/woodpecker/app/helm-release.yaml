---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: woodpecker
  namespace: woodpecker
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: woodpecker-charts
    namespace: flux-system
  values:
    agent:
      replicaCount: 1
      # Sized from 30 days of observed usage.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 96Mi
      env:
        WOODPECKER_BACKEND_K8S_STORAGE_CLASS: "ceph-rbd"
        # Filesystem-mode Ceph RBD pipeline volumes must be RWO.
        WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
        # Co-locate steps and services to prevent Multi-Attach; update this when
        # retiring the selected node.
        WOODPECKER_BACKEND_K8S_POD_NODE_SELECTOR: '{"kubernetes.io/hostname":"k3s-helium"}'
      persistence:
        storageClass: "ceph-rbd"
    server:
      # Sized from 30 days of observed usage.
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 192Mi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "cogs"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          external-dns.alpha.kubernetes.io/target: "${SECRET_CLOUDFLARE_TUNNEL_DOMAIN}"
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-cloudflarewarp@kubernetescrd"
          external-dns/external: "true"
        hosts:
          - host: "woodpecker.${SECRET_LAB_DOMAIN}"
            paths:
              - path: /
        tls:
          - secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
            hosts:
              - "woodpecker.${SECRET_LAB_DOMAIN}"
      persistence:
        storageClass: "ceph-rbd"
      persistentVolume:
        storageClass: "ceph-rbd"
      env:
        WOODPECKER_HOST: "https://woodpecker.${SECRET_LAB_DOMAIN}"
        WOODPECKER_ADMIN: "yoyostile"
        WOODPECKER_OPEN: "false"
        WOODPECKER_PLUGINS_PRIVILEGED: woodpeckerci/plugin-docker-buildx
        WOODPECKER_GITHUB: "true"
      extraSecretNamesForEnvFrom:
        - woodpecker-env

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: woodpecker
  namespace: woodpecker
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: woodpecker-charts
    namespace: flux-system
  values:
    agent:
      replicaCount: 1
      env:
        WOODPECKER_BACKEND_K8S_STORAGE_CLASS: "ceph-rbd"
        # ceph-rbd is filesystem-mode RBD: RWX needs volumeMode Block, so pipeline
        # PVCs must be RWO (provisioning fails as RWX/ReadWriteMany otherwise).
        WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
        # RWX=false makes the workspace PVC ReadWriteOnce but does NOT co-schedule
        # the step pod with its service containers (e.g. a postgres service) — they
        # can land on different nodes and the second one fails with Multi-Attach.
        # Pin every pipeline pod to one node so the RWO volume is always local.
        # This names a specific node, so retiring it strands every pipeline in
        # Pending with "didn't match Pod's node affinity/selector" — which is how
        # the previous value (k3s2) failed. Repoint it when this node goes.
        WOODPECKER_BACKEND_K8S_POD_NODE_SELECTOR: '{"kubernetes.io/hostname":"k3s-helium"}'
      persistence:
        storageClass: "ceph-rbd"
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "cogs"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          external-dns.alpha.kubernetes.io/target: "${SECRET_CLOUDFLARE_TUNNEL_DOMAIN}"
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-cloudflarewarp@kubernetescrd"
          external-dns/external: "true"
        hosts:
          - host: "woodpecker.${SECRET_LAB_DOMAIN}"
            paths:
              - path: /
        tls:
          - secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
            hosts:
              - "woodpecker.${SECRET_LAB_DOMAIN}"
      persistence:
        storageClass: "ceph-rbd"
      persistentVolume:
        storageClass: "ceph-rbd"
      env:
        WOODPECKER_HOST: "https://woodpecker.${SECRET_LAB_DOMAIN}"
        WOODPECKER_ADMIN: "yoyostile"
        WOODPECKER_OPEN: "false"
        WOODPECKER_PLUGINS_PRIVILEGED: woodpeckerci/plugin-docker-buildx
        WOODPECKER_GITHUB: "true"
      extraSecretNamesForEnvFrom:
        - woodpecker-env

---
# Keep the SQLite database on Ceph RBD, not NFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 5Gi
---
# Move recordings to nfs-client before enabling continuous retention.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 10Gi

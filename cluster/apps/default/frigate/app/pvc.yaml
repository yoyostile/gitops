---
# frigate.db is SQLite: it must not live on NFS, so config is on ceph-rbd.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 5Gi
---
# Snapshots only while record is disabled, so this stays small. If recording is
# ever enabled, move this claim to nfs-client instead of growing it -- continuous
# full-res segment churn does not belong on the SSD-backed ceph pool.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: default
  annotations:
    # Restart the pod to refresh this subPath-mounted ConfigMap.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      # CPU-only enrichments run on the MS-A2 node.
      nodeSelector:
        topology.kubernetes.io/zone: pve02
      containers:
        - name: frigate
          # renovate: datasource=github-releases depName=blakeblackshear/frigate
          image: ghcr.io/blakeblackshear/frigate:0.17.2
          envFrom:
            - secretRef:
                name: frigate-streams
          env:
            - name: TZ
              value: ${TZ}
          ports:
            - name: http
              containerPort: 8971
            - name: rtsp
              containerPort: 8554
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              # Decode, detection, and enrichments all run on CPU.
              cpu: "6"
              memory: 8Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-file
              mountPath: /config/config.yml
              subPath: config.yml
              readOnly: true
            - name: media
              mountPath: /media/frigate
            - name: cache
              mountPath: /tmp/cache
            - name: shm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /api/version
              # Port 5000 bypasses proxy authentication for health checks.
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        - name: config-file
          configMap:
            name: frigate-config
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: default
  annotations:
    # config.yml is a subPath mount, which kubelet never refreshes in place --
    # only a new pod picks up a changed ConfigMap.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      # The MS-A2 (Ryzen 9 8945HX, 8 cores) rather than the Intel iGPU nodes:
      # the enrichments are CPU-only whatever the host, and decoding 3
      # sub-megapixel streams at 5 fps does not need hardware acceleration.
      nodeSelector:
        topology.kubernetes.io/zone: pve02
      containers:
        - name: frigate
          # renovate: datasource=github-releases depName=blakeblackshear/frigate
          image: ghcr.io/blakeblackshear/frigate:0.17.2
          envFrom:
            - secretRef:
                name: frigate-streams
          env:
            - name: TZ
              value: ${TZ}
          ports:
            - name: http
              containerPort: 8971
            - name: rtsp
              containerPort: 8554
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              # everything is software here: decode, object detection, and the
              # semantic-search / face / lpr enrichments
              cpu: "6"
              memory: 8Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-file
              mountPath: /config/config.yml
              subPath: config.yml
              readOnly: true
            - name: media
              mountPath: /media/frigate
            - name: cache
              mountPath: /tmp/cache
            - name: shm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /api/version
              # 5000 is the internal port that ignores auth headers; probing
              # 8971 would be subject to proxy auth and restart a healthy pod
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        - name: config-file
          configMap:
            name: frigate-config
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

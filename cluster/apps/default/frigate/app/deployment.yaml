---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: default
  annotations:
    # config.yml is a subPath mount, which kubelet never refreshes in place --
    # only a new pod picks up a changed ConfigMap.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      containers:
        - name: frigate
          # renovate: datasource=github-releases depName=blakeblackshear/frigate
          image: ghcr.io/blakeblackshear/frigate:0.17.2
          envFrom:
            - secretRef:
                name: frigate-streams
          env:
            - name: TZ
              value: ${TZ}
            - name: LIBVA_DRIVER_NAME
              value: iHD
          ports:
            - name: http
              containerPort: 8971
            - name: rtsp
              containerPort: 8554
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              gpu.intel.com/i915: 1
            limits:
              # requesting i915 is what pins this to an iGPU node -- no
              # nodeSelector needed, the device plugin advertises it on
              # argon/neon (pve01) and krypton/xenon (pve03)
              memory: 3Gi
              gpu.intel.com/i915: 1
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-file
              mountPath: /config/config.yml
              subPath: config.yml
              readOnly: true
            - name: media
              mountPath: /media/frigate
            - name: cache
              mountPath: /tmp/cache
            - name: shm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        - name: config-file
          configMap:
            name: frigate-config
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
  namespace: default
data:
  config.yml: |
    mqtt:
      enabled: true
      host: mosquitto.default.svc.cluster.local
      port: 1883
      topic_prefix: frigate

    # This VM has no render node; detection and decoding run on CPU.
    detectors:
      cpu:
        type: cpu
        num_threads: 4

    model:
      width: 320
      height: 320
      input_tensor: nhwc
      input_pixel_format: rgb
      path: /cpu_model.tflite
      labelmap_path: /labelmap.txt

    # go2rtc handles UniFi Protect's TLS/SRTP handshake. Its create_config.py
    # substitutes the {FRIGATE_*} placeholders below.
    go2rtc:
      streams:
        haustuere: "{FRIGATE_HAUSTUERE_DETECT}"
        garten: "{FRIGATE_GARTEN_DETECT}"
        durchgang: "{FRIGATE_DURCHGANG_DETECT}"
        haustuere_high: "{FRIGATE_HAUSTUERE_RECORD}"
        garten_high: "{FRIGATE_GARTEN_RECORD}"
        durchgang_high: "{FRIGATE_DURCHGANG_RECORD}"

    # No hwaccel_args: the VM has no render node.

    # Terminate TLS at Traefik.
    tls:
      enabled: false

    # Authentik supplies identity headers on port 8971; port 5000 ignores them.
    auth:
      enabled: false
      trusted_proxies:
        - 10.42.0.0/16

    proxy:
      header_map:
        user: x-authentik-username
        role: x-authentik-groups
        # role_map belongs under header_map; auth.roles configures camera access.
        role_map:
          admin:
            - authentik Admins
      # authentik joins group names with a pipe
      separator: "|"
      default_role: viewer
      logout_url: /outpost.goauthentik.io/sign_out

    detect:
      # Detection defaults off. Stream resolution is probed automatically.
      enabled: true
      fps: 5

    objects:
      track:
        - person
        # required for lpr -- it only inspects car/motorcycle objects
        - car

    motion:
      # Reduce false positives from nighttime IR noise.
      improve_contrast: true
      threshold: 30
      contour_area: 15

    # Frigate runs these enrichments on CPU.
    semantic_search:
      enabled: true
      model_size: small
      reindex: false

    face_recognition:
      enabled: true
      model_size: small

    lpr:
      enabled: true
      model_size: small

    snapshots:
      enabled: true
      timestamp: false
      bounding_box: true
      retain:
        default: 14

    record:
      # UniFi Protect already records continuously; avoid duplicate Ceph writes.
      enabled: false
      continuous:
        days: 0
      alerts:
        retain:
          days: 7
      detections:
        retain:
          days: 3

    cameras:
      haustuere:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/haustuere
              input_args: preset-rtsp-restream
              roles: [detect]

      garten:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/garten
              input_args: preset-rtsp-restream
              roles: [detect]

      durchgang:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/durchgang
              input_args: preset-rtsp-restream
              roles: [detect]

    # Keep aligned with the image's CURRENT_CONFIG_VERSION; migration cannot
    # write to this read-only ConfigMap mount.
    version: 0.17-0

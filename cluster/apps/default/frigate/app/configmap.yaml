---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
  namespace: default
data:
  config.yml: |
    mqtt:
      enabled: true
      host: mosquitto.default.svc.cluster.local
      port: 1883
      topic_prefix: frigate

    # Runs on the MS-A2 (pve02), whose VM exposes no /dev/dri render node -- so no
    # OpenVINO and no VAAPI. 8 Zen4 cores do object detection, decode and all
    # three enrichments in software instead.
    detectors:
      cpu:
        type: cpu
        num_threads: 4

    model:
      width: 320
      height: 320
      input_tensor: nhwc
      input_pixel_format: rgb
      path: /cpu_model.tflite
      labelmap_path: /labelmap.txt

    # UniFi Protect will not talk plain rtsps:// to ffmpeg -- it needs the rtspx
    # protocol through go2rtc, which handles the TLS/SRTP handshake. So the camera
    # URLs are declared here (Protect's rtsps:// path with the scheme swapped to
    # rtspx:// and ?enableSrtp dropped) and the cameras below consume go2rtc's
    # local restream instead. {FRIGATE_*} placeholders are substituted into this
    # block by go2rtc/create_config.py.
    go2rtc:
      streams:
        haustuere: "{FRIGATE_HAUSTUERE_DETECT}"
        garten: "{FRIGATE_GARTEN_DETECT}"
        durchgang: "{FRIGATE_DURCHGANG_DETECT}"
        haustuere_high: "{FRIGATE_HAUSTUERE_RECORD}"
        garten_high: "{FRIGATE_GARTEN_RECORD}"
        durchgang_high: "{FRIGATE_DURCHGANG_RECORD}"

    # No hwaccel_args on purpose: without a render node VAAPI fails outright.
    # Software decode of 3 sub-megapixel streams at 5 fps costs well under a core.

    # Frigate serves its UI on 8971 with its own TLS by default, which makes
    # Traefik answer 400. Terminate TLS at the edge instead.
    tls:
      enabled: false

    # Authentik's forward-auth middleware gates the ingress and injects the
    # identity headers (the shared networking-authentik middleware already lists
    # them in authResponseHeaders), so Frigate's own login is turned off.
    # Port 8971 is what validates these headers -- port 5000 ignores them and
    # treats every request as admin, which is why the Service targets 8971.
    auth:
      enabled: false
      trusted_proxies:
        - 10.42.0.0/16

    proxy:
      header_map:
        user: x-authentik-username
        role: x-authentik-groups
        # role_map belongs under header_map, not under proxy -- the docs show it
        # a level higher and Frigate then rejects the whole config with
        # "Extra inputs are not permitted". Note auth.roles is something else
        # entirely (custom role -> cameras) and reserves admin/viewer.
        role_map:
          admin:
            - authentik Admins
      # authentik joins group names with a pipe
      separator: "|"
      default_role: viewer
      logout_url: /outpost.goauthentik.io/sign_out

    detect:
      # enabled defaults to FALSE in 0.17 -- without this nothing is ever
      # detected, while cameras still look healthy in the UI. Resolution is
      # probed from the stream, so the vertical cameras need no special casing.
      # 5 fps is plenty: frames are dropped before decode.
      enabled: true
      fps: 5

    objects:
      track:
        - person
        # required for lpr -- it only inspects car/motorcycle objects
        - car

    motion:
      # IR sensor noise is what wakes the detector at night; contrast
      # improvement plus a higher threshold is the cheap half of the fix.
      improve_contrast: true
      threshold: 30
      contour_area: 15

    # Enrichments. All three run on CPU regardless of host (Frigate does not use
    # OpenVINO for these), which is the main reason this app lives on the MS-A2.
    semantic_search:
      enabled: true
      model_size: small
      reindex: false

    face_recognition:
      enabled: true
      model_size: small

    lpr:
      enabled: true
      model_size: small

    snapshots:
      enabled: true
      timestamp: false
      bounding_box: true
      retain:
        default: 14

    record:
      # Deliberately off. Frigate writes *every* segment and prunes the ones
      # without events afterwards, so "event-only" retention still means
      # ~150-200 GB/day of full-res writes for these three cameras, and UniFi
      # Protect already archives all of them 24/7. To enable: set enabled: true,
      # add the commented-out record input to each camera, and move the media
      # PVC to nfs-client -- that churn does not belong on the ceph SSD pool.
      enabled: false
      continuous:
        days: 0
      alerts:
        retain:
          days: 7
      detections:
        retain:
          days: 3

    cameras:
      haustuere:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/haustuere
              input_args: preset-rtsp-restream
              roles: [detect]
            # - path: rtsp://127.0.0.1:8554/haustuere_high
            #   input_args: preset-rtsp-restream
            #   roles: [record]

      garten:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/garten
              input_args: preset-rtsp-restream
              roles: [detect]
            # - path: rtsp://127.0.0.1:8554/garten_high
            #   input_args: preset-rtsp-restream
            #   roles: [record]

      durchgang:
        ffmpeg:
          inputs:
            - path: rtsp://127.0.0.1:8554/durchgang
              input_args: preset-rtsp-restream
              roles: [detect]
            # - path: rtsp://127.0.0.1:8554/durchgang_high
            #   input_args: preset-rtsp-restream
            #   roles: [record]

    # Must equal CURRENT_CONFIG_VERSION of the running image. An absent or older
    # value makes Frigate migrate the config and *write* config.yml, which fails
    # against this read-only ConfigMap mount -- so bump this together with the
    # image tag, never separately.
    version: 0.17-0

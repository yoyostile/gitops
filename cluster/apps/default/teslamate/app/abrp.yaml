---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: teslamate-abrp
  name: teslamate-abrp
  namespace: default
spec:
  replicas: 0
  selector:
    matchLabels:
      app: teslamate-abrp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: teslamate-abrp
    spec:
      containers:
        - name: teslamate-abrp
          image: fetzu/teslamate-abrp:4.0.2@sha256:a794a105a89b2762a022a660b01b2acced7f0f37ed6b7c991e7eba6a48925b18
          env:
            - name: MQTT_SERVER
              value: mosquitto.default
            - name: USER_TOKEN
              value: "${SECRET_ABRP_USER_TOKEN}"
            - name: CAR_NUMBER
              value: "1"
          imagePullPolicy: Always
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30

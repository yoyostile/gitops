---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teslamate
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: teslamate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teslamate
    spec:
      containers:
        - name: teslamate
          image: teslamate/teslamate:4.2.0
          env:
            - name: TZ
              value: "${TZ}"
            - name: DATABASE_HOST
              value: "psql-cluster-rw.default"
            - name: DATABASE_NAME
              value: "teslamate"
            - name: DATABASE_USER
              value: "teslamate"
            - name: DATABASE_PASS
              value: "${SECRET_TESLAMATE_POSTGRES_PASSWORD}"
            - name: MQTT_HOST
              value: "mosquitto.default"
            - name: DISABLE_MQTT
              value: "false"
            # Rotating this makes every stored Tesla credential unreadable.
            - name: ENCRYPTION_KEY
              value: "${SECRET_TESLAMATE_ENCRYPTION_KEY}"
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          # Sized from 30 days of observed usage.
          resources:
            requests:
              cpu: 10m
              memory: 384Mi
            limits:
              memory: 640Mi

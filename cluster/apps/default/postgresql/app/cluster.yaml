---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: psql-cluster
  namespace: default
spec:
  instances: 1

  # Sized from 14d of usage: p90 429Mi / 123m, peak 1173Mi. No CPU limit by design.
  resources:
    requests:
      memory: "512Mi"
      cpu: "150m"
    limits:
      memory: "1408Mi"
  # bootstrap:
  #   recovery:
  #     source: origin
  #     recoveryTarget:
  #       backupID: "20260204T120009"
  #       targetImmediate: true

  # externalClusters:
  #   - name: origin
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: cnpg-store
  #         serverName: psql-cluster

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-store

  storage:
    storageClass: "proxmox-data-ext4"
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi

---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Required: generator output carries no namespace, and Flux's SSA rejects that.
# `kubectl apply -f` does NOT reproduce the failure (it defaults from kubeconfig).
namespace: default
resources:
  - secret.sops.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# governance.pricing_overrides in config.json is GENERATED — regenerate with:
#   LYCEUM_API_KEY=$(kubectl -n default get secret bifrost-secrets \
#       -o jsonpath='{.data.LYCEUM_API_KEY}' | base64 -d) \
#     python3 cluster/apps/default/bifrost/app/gen-lyceum-pricing.py
#
# config_store must stay ENABLED: governance refuses to start without it, and
# governance is where the virtual keys live. source_of_truth keeps Git authoritative.
# The ConfigMap name hash is load-bearing: config.json is read only at startup.
#
# disable_content_logging is false, so prompts and completions (incl. invoice OCR)
# are stored on the bifrost-data PVC. Deliberate, for model comparison.
configMapGenerator:
  - name: bifrost-config
    files:
      - config.json

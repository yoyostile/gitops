---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Flux SSA requires a namespace on generated resources.
namespace: default
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# Regenerate governance.pricing_overrides in config.json with:
#   LYCEUM_API_KEY=$(sops -d --extract '["stringData"]["LYCEUM_API_KEY"]' \
#       cluster/apps/default/bifrost/app/secret.sops.yaml) \
#     python3 cluster/apps/default/bifrost/app/gen-lyceum-pricing.py
# Keep config_store enabled for governance and virtual keys. The name hash
# restarts Bifrost when its startup-only configuration changes.
# Content logging stores prompts and completions on bifrost-data for comparison.
configMapGenerator:
  - name: bifrost-config
    files:
      - config.json
# The manifest is patched onto an empty generator, whose name hash rolls the
# pod on every edit. Flux decrypts SOPS patches before the build.
secretGenerator:
  - name: bifrost-secrets
patches:
  - path: secret.sops.yaml

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bifrost-data
  namespace: default
spec:
  # ceph-rbd, not the nfs-client default: this volume holds a SQLite database
  # (the request log) and SQLite over NFS has unreliable locking.
  storageClassName: ceph-rbd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

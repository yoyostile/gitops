---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: default
  annotations:
    external-dns/internal: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: "172.16.38.202"
  externalTrafficPolicy: Local
  # Broker allows anonymous clients, so this list is the only access control.
  # Both LAN clients need a static DHCP lease or they lose MQTT on an IP change.
  loadBalancerSourceRanges:
    - 10.0.10.47/32 # hass (incl. hcpy)
    - 10.0.10.58/32 # Nuki "Wohnzimmer"
    - 10.42.0.0/16 # pods that dial the LB IP instead of the ClusterIP
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      protocol: TCP

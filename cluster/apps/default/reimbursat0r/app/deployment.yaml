---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reimbursat0r
  namespace: default
  labels:
    app: reimbursat0r
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reimbursat0r
  template:
    metadata:
      labels:
        app: reimbursat0r
    spec:
      imagePullSecrets:
        - name: global-docker-config
      containers:
        - name: reimbursat0r
          image: ghcr.io/yoyostile/reimbursat0r:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # Run Solid Queue with Puma in this single-pod deployment.
            - name: SOLID_QUEUE_IN_PUMA
              value: "true"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: PAPERLESS_TAG
              value: "mama"
            # Sync by scan time rather than the invoice's printed date.
            - name: PAPERLESS_SYNC_DATE_FIELD
              value: "added"
            # Exclude documents that reclaim rather than reimburse money.
            - name: PAPERLESS_NOTICE_QUERY
              value: "Erstattungsbescheid NOT Rückforderung NOT Aufhebungsbescheid"
            # BIFROST_VK_INVOICE restricts this path to Ollama.
            - name: EXTRACTION_BACKEND
              value: "bifrost"
            - name: BIFROST_URL
              value: "http://bifrost.default.svc.cluster.local:8080"
            # Selected by the invoice extraction evaluation.
            - name: EXTRACTION_MODEL_INVOICE
              value: "lyceum/meta-llama/Llama-3.3-70B-Instruct"
            # Selected by the notice line-item evaluation.
            - name: EXTRACTION_MODEL_NOTICE
              value: "lyceum/Qwen/Qwen3-235B-A22B-Instruct-2507"
            - name: BIFROST_VK_INVOICE
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: BIFROST_VK_INVOICE
            - name: BIFROST_VK_NOTICE
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: BIFROST_VK_NOTICE
            - name: PAPERLESS_URL
              value: "https://paperless.${SECRET_LAB_DOMAIN}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: SECRET_KEY_BASE
            - name: PAPERLESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: PAPERLESS_TOKEN
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

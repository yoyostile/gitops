---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reimbursat0r
  namespace: default
  labels:
    app: reimbursat0r
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reimbursat0r
  template:
    metadata:
      labels:
        app: reimbursat0r
    spec:
      imagePullSecrets:
        - name: global-docker-config
      containers:
        - name: reimbursat0r
          image: ghcr.io/yoyostile/reimbursat0r:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            # Solid Queue runs inside Puma (web + jobs + recurring in one pod).
            # Its tables now live in the primary DB (CreateSolidQueueCacheCableTables
            # migration, applied by db:prepare before Puma starts).
            - name: SOLID_QUEUE_IN_PUMA
              value: "true"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: PAPERLESS_TAG
              value: "mama"
            # Gate the sync window on when a doc was SCANNED into paperless, not the
            # invoice's printed date — an old-dated invoice scanned today must import.
            - name: PAPERLESS_SYNC_DATE_FIELD
              value: "added"
            # A Rückforderung/Aufhebungsbescheid references "Erstattungsbescheid" but is
            # NOT a reimbursement notice (it reclaims money) — keep it out of the notice path.
            - name: PAPERLESS_NOTICE_QUERY
              value: "Erstattungsbescheid NOT Rückforderung NOT Aufhebungsbescheid"
            - name: ANTHROPIC_MODEL
              value: "claude-sonnet-4-6"
            # Extraction goes through the Bifrost gateway. Same split as before —
            # invoices local, Bescheide on Sonnet — but the split is now enforced
            # by the gateway: BIFROST_VK_INVOICE is scoped to the ollama provider,
            # so naming a cloud model on the invoice path is rejected instead of
            # quietly honoured. PHI stays on the LAN by construction, not by this
            # value being correct.
            - name: EXTRACTION_BACKEND
              value: "bifrost"
            - name: BIFROST_URL
              value: "http://bifrost.default.svc.cluster.local:8080"
            # "-32k" is not cosmetic: Bifrost reaches Ollama via Ollama's
            # OpenAI-compatible endpoint, which drops the options object, so
            # num_ctx cannot travel with the request. The context size has to be
            # baked into the model with a Modelfile. Plain qwen2.5:7b here would
            # silently fall back to Ollama's 4096 default and truncate long OCR.
            - name: EXTRACTION_MODEL_INVOICE
              value: "ollama/qwen2.5:7b-32k"
            # Bescheid line-items are harder; 7B botched 2/4 in eval.
            - name: EXTRACTION_MODEL_NOTICE
              value: "anthropic/claude-sonnet-4-6"
            - name: BIFROST_VK_INVOICE
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: BIFROST_VK_INVOICE
            - name: BIFROST_VK_NOTICE
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: BIFROST_VK_NOTICE
            # Kept as the rollback path while the gateway is being A/B'd: setting
            # EXTRACTION_BACKEND back to "ollama" (plus EXTRACTION_BACKEND_NOTICE
            # "anthropic") restores the direct adapters with no image change.
            # Dropping these — and ANTHROPIC_API_KEY below — is what finally makes
            # cloud egress from this pod impossible rather than merely unused.
            - name: OLLAMA_HOST
              value: "http://sn0w.lan.${SECRET_LAB_DOMAIN}:11434"
            - name: OLLAMA_MODEL
              value: "qwen2.5:7b"
            - name: PAPERLESS_URL
              value: "https://paperless.${SECRET_LAB_DOMAIN}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: SECRET_KEY_BASE
            - name: PAPERLESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: PAPERLESS_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reimbursat0r-secrets
                  key: ANTHROPIC_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

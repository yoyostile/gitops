---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - deployment.yaml
  - service.yaml
# The manifests are patched onto empty generators, whose name hash rolls the
# pod on every edit. Flux decrypts SOPS patches before the build.
# zettelrobbe-secrets is copied under its own name: zettelrobbe's hashed name
# cannot be referenced from here.
configMapGenerator:
  - name: open-webui-tools
secretGenerator:
  - name: open-webui-tools-secrets
  - name: zettelrobbe-secrets-open-webui-tools
patches:
  - path: configmap.yaml
  - path: secret.sops.yaml
  - path: ../../zettelrobbe/app/secret.sops.yaml
    target:
      kind: Secret
      name: zettelrobbe-secrets-open-webui-tools

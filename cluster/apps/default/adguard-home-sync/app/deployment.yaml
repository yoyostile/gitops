---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home-sync
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard-home-sync
  template:
    metadata:
      labels:
        app: adguard-home-sync
    spec:
      containers:
        - name: adguard-home-sync
          image: ghcr.io/bakito/adguardhome-sync:v0.10.1@sha256:2dc30eedebf07bbb6d2fa8988734cebe41c70f6511829ff1c37b7bc6ab172615
          envFrom:
            - secretRef:
                name: adguard-home-sync
          env:
            - name: CRON
              value: "*/15 * * * *"
          args: ["run"]

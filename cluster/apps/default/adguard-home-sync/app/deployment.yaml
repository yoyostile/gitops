---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home-sync
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard-home-sync
  template:
    metadata:
      labels:
        app: adguard-home-sync
    spec:
      containers:
        - name: adguard-home-sync
          image: ghcr.io/bakito/adguardhome-sync:v0.9.6@sha256:157e509baeef66cd400dae96c955a1e97312670e0285a92ebe2c3465b3e22e67
          envFrom:
            - secretRef:
                name: adguard-home-sync
          env:
            - name: CRON
              value: "*/15 * * * *"
          args: ["run"]

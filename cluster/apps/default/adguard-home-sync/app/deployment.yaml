---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home-sync
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard-home-sync
  template:
    metadata:
      labels:
        app: adguard-home-sync
    spec:
      containers:
        - name: adguard-home-sync
          image: ghcr.io/bakito/adguardhome-sync:v0.9.5@sha256:8c5d65ef00b54cd8c2e78ccc70722ce322cf8ca5069b669e07c1e4edcd1836c7
          envFrom:
            - secretRef:
                name: adguard-home-sync
          env:
            - name: CRON
              value: "*/15 * * * *"
          args: ["run"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zettelrobbe
  namespace: default
  labels:
    app: zettelrobbe
spec:
  replicas: 1
  # RWO volume + SQLite: a rolling update deadlocks on the attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zettelrobbe
  template:
    metadata:
      labels:
        app: zettelrobbe
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: zettelrobbe
          image: docker.io/admonstrator/zettelrobbe:v2026.07.04
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PAPERLESS_AI_PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            # TODO remove: pre-setup it 403s all non-localhost requests (probe + browser).
            - name: ALLOW_REMOTE_SETUP
              value: "yes"
            - name: TRUST_PROXY
              value: "yes"
            # Also used for the UI's document links, so not the ClusterIP. No /api suffix.
            - name: PAPERLESS_API_URL
              value: "https://paperless.${SECRET_LAB_DOMAIN}"
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zettelrobbe-secrets
                  key: PAPERLESS_API_TOKEN
            - name: AI_PROVIDER
              value: "custom"
            - name: CUSTOM_BASE_URL
              value: "http://bifrost.default.svc.cluster.local:8080/v1"
            - name: CUSTOM_MODEL
              value: "lyceum/z-ai/glm-5.2-instant"
            - name: CUSTOM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zettelrobbe-secrets
                  key: CUSTOM_API_KEY
            # Restrictions are off; this feeds the existing vocabulary as context
            # so it reuses tags instead of coining near-duplicates.
            - name: USE_EXISTING_DATA
              value: "yes"
            - name: ACTIVATE_TAGGING
              value: "yes"
            - name: ACTIVATE_CORRESPONDENTS
              value: "yes"
            - name: ACTIVATE_DOCUMENT_TYPE
              value: "yes"
            - name: ACTIVATE_TITLE
              value: "yes"
            # Paused: nothing is written until triggered by hand.
            - name: DISABLE_AUTOMATIC_PROCESSING
              value: "yes"
            - name: ADD_AI_PROCESSED_TAG
              value: "yes"
            - name: AI_PROCESSED_TAG_NAME
              value: "ai-processed"
            # Mirrors the setup wizard; see /app/data/runtime-overrides.json.
            # Username, NOT the email — matched literally against /api/users/.
            - name: PAPERLESS_USERNAME
              value: "yoyostile"
            - name: IGNORE_TAGS
              value: "ai-processed"
            - name: PROCESS_PREDEFINED_DOCUMENTS
              value: "no"
            - name: SCAN_INTERVAL
              value: "*/30 * * * *"
            - name: SETUP_VALIDATION_TIMEOUT_MS
              value: "120000"
            - name: SETUP_OCR_VALIDATION_TIMEOUT_MS
              value: "120000"
            # "MISTRAL_*" is a legacy name only: OCR_PROVIDER=custom routes via OCR_API_URL.
            - name: MISTRAL_OCR_ENABLED
              value: "yes"
            - name: OCR_PROVIDER
              value: "custom"
            - name: OCR_API_URL
              value: "http://bifrost.default.svc.cluster.local:8080/v1"
            - name: MISTRAL_OCR_MODEL
              value: "lyceum/Qwen/Qwen2.5-VL-72B-Instruct"
            - name: OCR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zettelrobbe-secrets
                  key: CUSTOM_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zettelrobbe-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "1"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zettelrobbe-data

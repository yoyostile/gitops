---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: adguard-exporter
  namespace: default
  labels:
    app: adguard-exporter
spec:
  endpoints:
    - port: metrics
      metricRelabelings:
        # Drop the duplicate millisecond processing-time histogram.
        - sourceLabels: [__name__]
          regex: adguard_processing_time_milliseconds.*
          action: drop
        # adguard_queries_details provides the same counts without buckets.
        - sourceLabels: [__name__]
          regex: adguard_queries_details_histogram.*
          action: drop
        # Keep per-client processing buckets despite their high cardinality.
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: adguard-exporter

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: echoip
  name: echoip
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echoip
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: echoip
    spec:
      initContainers:
        # GeoLite2 allows 30 downloads per 24h per account; each pod start uses 3.
        - name: geoip-download
          # Not busybox wget: it gets a 401 on MaxMind's redirect to R2.
          image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for edition in ASN City Country; do
                curl -fsSL -o "/geoip/GeoLite2-$${edition}.tar.gz" \
                  "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-$${edition}&license_key=$${MAXMIND_LICENSE_KEY}&suffix=tar.gz"
              done
          env:
            - name: MAXMIND_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: echoip-maxmind
                  key: MAXMIND_LICENSE_KEY
          volumeMounts:
            - name: geoip
              mountPath: /geoip
        - name: geoip-extract
          image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cd /geoip
              for f in *.tar.gz; do tar xzf "$f"; done
              find /geoip -name "*.mmdb" -exec cp {} /geoip/ \;
              rm -rf /geoip/GeoLite2-*_*/ /geoip/*.tar.gz
              echo "GeoIP databases ready:"
              ls -la /geoip/
          volumeMounts:
            - name: geoip
              mountPath: /geoip
      containers:
        - args:
            - -H
            - X-Real-IP
            - -a
            - /geoip/GeoLite2-ASN.mmdb
            - -c
            - /geoip/GeoLite2-City.mmdb
            - -f
            - /geoip/GeoLite2-Country.mmdb
          # mpolden/echoip publishes no version tags, only :latest.
          image: mpolden/echoip:latest@sha256:fa411cb4625738574621236a029fa5bbb7b6574051edf7eeb579c6991ef52e92
          imagePullPolicy: Always
          name: echoip
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: geoip
              mountPath: /geoip
              readOnly: true
      volumes:
        - name: geoip
          emptyDir: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30

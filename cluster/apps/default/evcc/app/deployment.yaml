---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evcc
  namespace: default
spec:
  replicas: 1
  # Recreate prevents Multi-Attach on the ReadWriteOnce data volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: evcc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evcc
    spec:
      containers:
        - name: evcc
          image: evcc/evcc:0.319.1@sha256:b4fb63cb90710a989d4f491bd81a6505326337a22a95e82c3227fd78ffd5116d
          ports:
            - name: http
              containerPort: 7070
            - name: huawei
              containerPort: 5021
            - name: marstek
              containerPort: 5022
          volumeMounts:
            - name: config
              mountPath: /etc/evcc.yaml
              subPath: evcc.yaml
              readOnly: true
            - name: data
              mountPath: /root/.evcc
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: evcc-config
        - name: data
          persistentVolumeClaim:
            claimName: evcc-data

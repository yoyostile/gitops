---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
  - authentik-blueprint.yaml
# evcc.yaml is a subPath mount, which never sees ConfigMap updates.
# The manifest is patched onto an empty generator, whose name hash rolls the
# pod on every edit. Flux decrypts SOPS patches before the build.
configMapGenerator:
  - name: evcc-config
    namespace: default
patches:
  - path: configmap.sops.yaml

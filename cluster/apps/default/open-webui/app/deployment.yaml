---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: default
  labels:
    app: open-webui
spec:
  replicas: 1
  # RWO volume + SQLite: do not start a second pod during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /app/backend/data
            - name: WEBUI_NAME
              value: Bifrost Chat
            - name: WEBUI_URL
              value: "https://openwebui.${SECRET_LAB_DOMAIN}"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: OPEN_WEBUI_SECRET_KEY
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: authentik
            - name: OPENID_PROVIDER_URL
              value: "https://auth.${SECRET_LAB_DOMAIN}/application/o/open-web-ui-oauth/.well-known/openid-configuration"
            - name: OPENID_REDIRECT_URI
              value: "https://openwebui.${SECRET_LAB_DOMAIN}/oauth/oidc/callback"
            - name: OAUTH_SCOPES
              value: "openid email profile"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: OPEN_WEBUI_OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: OPEN_WEBUI_OAUTH_CLIENT_SECRET
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: ENABLE_OPENAI_API_PASSTHROUGH
              value: "false"
            # Same OpenAI-compatible Bifrost endpoint with provider-scoped
            # virtual keys. The broad eval key stays out of long-running pods.
            - name: OPENAI_API_BASE_URLS
              value: "http://bifrost.default.svc.cluster.local:8080/v1;http://bifrost.default.svc.cluster.local:8080/v1;http://bifrost.default.svc.cluster.local:8080/v1"
            - name: BIFROST_VK_GENERAL
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_VK_GENERAL
            - name: BIFROST_VK_LYCEUM
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_VK_LYCEUM
            - name: BIFROST_VK_TENSORX
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_VK_TENSORX
            - name: OPENAI_API_KEYS
              value: "$(BIFROST_VK_GENERAL);$(BIFROST_VK_LYCEUM);$(BIFROST_VK_TENSORX)"
            # Known-good through the existing Bifrost setup; users can change
            # their own default in Open WebUI after first login.
            - name: DEFAULT_MODELS
              value: "lyceum/z-ai/glm-5.2-instant"
            - name: TASK_MODEL_EXTERNAL
              value: "lyceum/z-ai/glm-5.2-instant"
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: "2"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data

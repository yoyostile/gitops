---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: default
  labels:
    app: open-webui
spec:
  replicas: 1
  # RWO volume + SQLite: do not start a second pod during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /app/backend/data
            - name: WEBUI_NAME
              value: Bifrost Chat
            - name: WEBUI_URL
              value: "https://openwebui.${SECRET_LAB_DOMAIN}"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: OPEN_WEBUI_SECRET_KEY
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_PASSWORD_AUTH
              value: "false"
            - name: OAUTH_AUTO_REDIRECT
              value: "true"
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: authentik
            - name: OPENID_PROVIDER_URL
              value: "https://auth.${SECRET_LAB_DOMAIN}/application/o/open-web-ui-oauth/.well-known/openid-configuration"
            - name: OPENID_REDIRECT_URI
              value: "https://openwebui.${SECRET_LAB_DOMAIN}/oauth/oidc/callback"
            - name: OAUTH_SCOPES
              value: "openid email profile"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: OPEN_WEBUI_OAUTH_CLIENT_ID
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: OPEN_WEBUI_OAUTH_CLIENT_SECRET
            - name: ENABLE_OLLAMA_API
              value: "false"
            # Connections share a URL and differ by virtual key. Tags identify
            # them without rewriting model IDs; keys are connection indexes.
            - name: OPENAI_API_CONFIGS
              value: '{"0":{"tags":["general"]},"1":{"tags":["openrouter"]},"2":{"tags":["hetzner"]}}'
            # Cache model lists; refresh the UI or restart after upstream changes.
            - name: ENABLE_BASE_MODELS_CACHE
              value: "true"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: ENABLE_OPENAI_API_PASSTHROUGH
              value: "false"
            # Provider-scoped virtual keys for the shared Bifrost endpoint.
            - name: OPENAI_API_BASE_URLS
              value: "http://bifrost.default.svc.cluster.local:8080/v1;http://bifrost.default.svc.cluster.local:8080/v1;http://bifrost.default.svc.cluster.local:8080/v1"
            - name: BIFROST_VK_GENERAL
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_VK_GENERAL
            - name: BIFROST_VK_TENSORX
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_VK_TENSORX
            - name: BIFROST_VK_OPENROUTER
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_VK_OPENROUTER
            - name: BIFROST_VK_HETZNER
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: BIFROST_VK_HETZNER
            - name: OPENAI_API_KEYS
              value: "$(BIFROST_VK_GENERAL);$(BIFROST_VK_OPENROUTER);$(BIFROST_VK_HETZNER)"
            # EU-processed default; users can override it after first login.
            - name: DEFAULT_MODELS
              value: "hetzner/GLM-5.2-NVFP4"
            - name: TASK_MODEL_EXTERNAL
              value: "hetzner/GLM-5.2-NVFP4"
            - name: OPEN_WEBUI_TOOLS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-tools-secrets
                  key: API_KEY
            # Seeds fresh databases; existing instances retain Admin Settings.
            - name: TOOL_SERVER_CONNECTIONS
              value: >-
                [{"type":"openapi","url":"http://open-webui-tools.default.svc.cluster.local:3000","spec_type":"url","spec":"","path":"openapi.json","auth_type":"bearer","key":"$(OPEN_WEBUI_TOOLS_API_KEY)","config":{"enable":true},"info":{"id":"homelab","name":"Homelab","description":"Read-only Paperless search and service health tools."}}]
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: "2"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data

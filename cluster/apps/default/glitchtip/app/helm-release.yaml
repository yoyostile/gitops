---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glitchtip
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://gitlab.com/api/v4/projects/16325141/packages/helm/stable
      chart: glitchtip
      version: 9.0.1
      sourceRef:
        kind: HelmRepository
        name: glitchtip-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: glitchtip/glitchtip
      # Load-bearing pin: the chart's appVersion (6.2.3) is OLDER than this, so
      # dropping the tag downgrades the app against a DB already migrated by
      # 6.2.6. 6.2.2 also fails the logs.0001_initial migration (gt_rust driver).
      tag: 6.2.6
      pullPolicy: IfNotPresent

    # Chart v9 sources connection settings from this Secret.
    glitchtip:
      domain: https://glitchtip.${SECRET_LAB_DOMAIN}
      existingSecret: glitchtip-secret
      existingSecretKey: SECRET_KEY
      database:
        existingSecret: glitchtip-secret
        existingSecretKey: DATABASE_URL
      valkey:
        existingSecret: glitchtip-secret
        existingSecretKey: REDIS_URL

    # Use the shared Postgres and Redis services.
    postgresql:
      enabled: false
    valkey:
      enabled: false

    # Non-secret environment shared by all components.
    extraEnvVars:
      - name: ENABLE_SOCIAL_AUTH
        value: "false"
      - name: ENABLE_ORGANIZATION_CREATION
        value: "true"
      - name: CELERY_WORKER_AUTOSCALE
        value: "1,3"
      - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
        value: "10000"
      - name: DEFAULT_FROM_EMAIL
        value: "noreply@${SECRET_LAB_DOMAIN}"
      - name: DEFAULT_FILE_STORAGE
        value: "${GLITCHTIP_DEFAULT_FILE_STORAGE}"
      - name: AWS_STORAGE_BUCKET_NAME
        value: "${GLITCHTIP_AWS_STORAGE_BUCKET_NAME}"
      - name: AWS_S3_ENDPOINT_URL
        value: "${GLITCHTIP_AWS_S3_ENDPOINT_URL}"
      - name: EMAIL_URL
        valueFrom:
          secretKeyRef:
            name: glitchtip-secret
            key: EMAIL_URL
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: glitchtip-secret
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: glitchtip-secret
            key: AWS_SECRET_ACCESS_KEY

    migrationJob:
      enabled: true
      activeDeadlineSeconds: 900
      # Chart v9 stopped passing the root extraEnvVars into this Job, so they
      # are mirrored here to keep the migration environment identical to v8.
      extraEnvVars:
        - name: ENABLE_SOCIAL_AUTH
          value: "false"
        - name: ENABLE_ORGANIZATION_CREATION
          value: "true"
        - name: CELERY_WORKER_AUTOSCALE
          value: "1,3"
        - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
          value: "10000"
        - name: DEFAULT_FROM_EMAIL
          value: "noreply@${SECRET_LAB_DOMAIN}"
        - name: EMAIL_URL
          valueFrom:
            secretKeyRef:
              name: glitchtip-secret
              key: EMAIL_URL
        - name: DEFAULT_FILE_STORAGE
          value: "${GLITCHTIP_DEFAULT_FILE_STORAGE}"
        - name: AWS_STORAGE_BUCKET_NAME
          value: "${GLITCHTIP_AWS_STORAGE_BUCKET_NAME}"
        - name: AWS_S3_ENDPOINT_URL
          value: "${GLITCHTIP_AWS_S3_ENDPOINT_URL}"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: glitchtip-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: glitchtip-secret
              key: AWS_SECRET_ACCESS_KEY

    # Chart v9 flattened web.* to the chart root and always embeds the worker.
    replicaCount: 1
    autoscaling:
      enabled: false
    budget:
      minAvailable: 1
    service:
      type: ClusterIP
      port: 80
    ingress:
      enabled: true
      className: traefik
      annotations:
        hajimari.io/enable: "true"
        hajimari.io/icon: "alert-circle"
        traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
        external-dns.alpha.kubernetes.io/target: "${SECRET_CLOUDFLARE_TUNNEL_DOMAIN}"
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
        traefik.ingress.kubernetes.io/router.middlewares: "networking-cloudflarewarp@kubernetescrd"
        external-dns/external: "true"
      hosts:
        - host: glitchtip.${SECRET_LAB_DOMAIN}
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - "glitchtip.${SECRET_LAB_DOMAIN}"
          secretName: "${SECRET_LAB_DOMAIN/./-}-tls"

    serviceAccount:
      create: false

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: shhh-redirect
  namespace: default
spec:
  redirectRegex:
    regex: ^https?://shhh\.[^/]+/.*
    replacement: https://yopass.${SECRET_LAB_DOMAIN}/
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shhh-redirect
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    external-dns.kubernetes.io/target: "${SECRET_CLOUDFLARE_TUNNEL_DOMAIN}"
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "networking-cloudflarewarp@kubernetescrd,default-shhh-redirect@kubernetescrd"
    external-dns/external: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
      hosts:
        - shhh.${SECRET_LAB_DOMAIN}
  rules:
    - host: shhh.${SECRET_LAB_DOMAIN}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: yopass
                port:
                  name: http

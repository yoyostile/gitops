---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: yopass
  name: yopass
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yopass
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: yopass
    spec:
      containers:
        - name: yopass
          image: docker.io/jhaals/yopass:16.0.1@sha256:6e45ce6c6c694a094643e433c45e36d66d516a3a70235321186e4c061942d6d0
          args:
            - --memcached=localhost:11211
          ports:
            - name: http
              containerPort: 1337
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: memcached
          image: docker.io/library/memcached:1.6.45-alpine@sha256:6a089e37cbb8acd75c80c6c0667fe57ec54db68782fb1b3afb1d0eb265e50070
          args:
            - -m
            - "64"
          ports:
            - name: memcached
              containerPort: 11211
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi

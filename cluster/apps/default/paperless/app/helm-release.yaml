---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts
      chart: paperless
      version: 9.1.3
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home-charts
        namespace: flux-system
      interval: 5m

  dependsOn:
    - name: traefik
      namespace: networking

  # See https://github.com/k8s-at-home/charts/blob/master/charts/paperless/values.yaml
  values:
    nodeSelector:
      topology.kubernetes.io/region: lab
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      tag: 3.0.4

    env:
      # Mandatory from 3.0 — paperless refuses to start without it. Also signs
      # sessions, so introducing it logs everyone out once.
      PAPERLESS_SECRET_KEY: "${SECRET_PAPERLESS_SECRET_KEY}"
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_TIME_ZONE: "${TZ}"
      PAPERLESS_CONSUMER_POLLING: "60"
      PAPERLESS_REDIS: "${SECRET_PAPERLESS_REDIS}"
      PAPERLESS_DBHOST: "psql-cluster-rw.default"
      PAPERLESS_DBPASS: "${SECRET_PAPERLESS_POSTGRES_PASSWORD}"
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: ${SECRET_PAPERLESS_SOCIALACCOUNT_PROVIDERS}
      PAPERLESS_OCR_USER_ARGS: "{\"invalidate_digital_signatures\": true}"

      # --- Built-in AI (3.x): suggestions + RAG, routed through the Bifrost
      # gateway onto Lyceum (EU, Berlin). The virtual key is scoped to the lyceum
      # provider only, so document text cannot reach Anthropic or OpenAI from here
      # even if a model name is mistyped — verified: anthropic/* returns 403.
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: "openai-like"
      # Must include /v1 — llama_index's OpenAILike passes this as the SDK
      # api_base and appends /chat/completions itself.
      PAPERLESS_AI_LLM_ENDPOINT: "http://bifrost.default.svc.cluster.local:8080/v1"
      # Sent as "Authorization: Bearer". OpenAILike cannot set x-bf-vk, but
      # Bifrost accepts a virtual key on Authorization too (verified).
      PAPERLESS_AI_LLM_API_KEY: "${SECRET_PAPERLESS_BIFROST_VK}"
      # Lowercase "lyceum" — the provider name in Bifrost's config.json, which is
      # NOT the "Lyceum/..." spelling other tooling uses.
      # glm-5.2-instant over deepseek-v4-flash: suggestions are interactive, and
      # measured over 2x10 documents deepseek averaged ~38 s and hit a 504 in both
      # runs, vs ~7-16 s and none for glm — at equal or better field accuracy.
      PAPERLESS_AI_LLM_MODEL: "lyceum/z-ai/glm-5.2-instant"
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: "openai-like"
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: "lyceum/Qwen/Qwen3-Embedding-8B"
      # Bifrost is a ClusterIP (RFC1918); the default is already true but this is
      # load-bearing, so it is explicit.
      PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: "true"
      # Default 120 is too tight: measured 30-40 s per call on these models, with
      # an occasional hit against Bifrost's own 300 s provider timeout.
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "300"
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: "de"
      USERMAP_UID: "3000"
      USERMAP_GID: "3000"

    persistence:
      data:
        enabled: true
        storageClass: "nfs-client"
        accessMode: ReadWriteOnce
        size: 5Gi
        labels:
          velero.io/exclude-from-backup: "true"
      media:
        enabled: true
        storageClass: "nfs-client"
        accessMode: ReadWriteOnce
        size: 5Gi
        labels:
          velero.io/exclude-from-backup: "true"
      consume:
        enabled: false
        type: custom
        volumeSpec:
          nfs:
            server: "${SECRET_NFS_HOST}"
            path: "${SECRET_NFS_PATH}/paperless/import"
        mountPath: /usr/src/paperless/consume
      export:
        enabled: false
        type: custom
        volumeSpec:
          nfs:
            server: "${SECRET_NFS_HOST}"
            path: "${SECRET_NFS_PATH}/paperless/export"
        mountPath: /usr/src/paperless/export

    ingress:
      main:
        enabled: true
        ingressClassName: "traefik-internal"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "note-multiple"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-internal-ips-only@kubernetescrd"
          external-dns/internal: "true"
        hosts:
          - host: "paperless.${SECRET_LAB_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
            hosts:
              - "paperless.${SECRET_LAB_DOMAIN}"

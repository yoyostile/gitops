---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts
      chart: paperless
      version: 9.1.3
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home-charts
        namespace: flux-system
      interval: 5m

  dependsOn:
    - name: traefik
      namespace: networking

  # See https://github.com/k8s-at-home/charts/blob/master/charts/paperless/values.yaml
  values:
    nodeSelector:
      topology.kubernetes.io/region: lab
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      tag: 3.0.5

    env:
      # Mandatory from 3.0. Also signs sessions, so changing it logs everyone out.
      PAPERLESS_SECRET_KEY: "${SECRET_PAPERLESS_SECRET_KEY}"
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_TIME_ZONE: "${TZ}"
      PAPERLESS_CONSUMER_POLLING: "60"
      PAPERLESS_REDIS: "${SECRET_PAPERLESS_REDIS}"
      PAPERLESS_DBHOST: "psql-cluster-rw.default"
      PAPERLESS_DBPASS: "${SECRET_PAPERLESS_POSTGRES_PASSWORD}"
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: ${SECRET_PAPERLESS_SOCIALACCOUNT_PROVIDERS}
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'

      # Built-in AI via Bifrost; the virtual key is scoped to lyceum only.
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: "openai-like"
      # /v1 required: OpenAILike appends /chat/completions itself.
      PAPERLESS_AI_LLM_ENDPOINT: "http://bifrost.default.svc.cluster.local:8080/v1"
      PAPERLESS_AI_LLM_API_KEY: "${SECRET_PAPERLESS_BIFROST_VK}"
      # Lowercase "lyceum" — the provider name in Bifrost, not "Lyceum/...".
      PAPERLESS_AI_LLM_MODEL: "lyceum/z-ai/glm-5.2-instant"
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: "openai-like"
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: "lyceum/Qwen/Qwen3-Embedding-8B"
      # Load-bearing: Bifrost is a ClusterIP (RFC1918).
      PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS: "true"
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "300"
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: "de"
      USERMAP_UID: "3000"
      USERMAP_GID: "3000"

    # Sized from 14d of usage: p90 935Mi / 220m, peak 2923Mi.
    resources:
      requests:
        memory: 1088Mi
        cpu: 265m
      limits:
        memory: 3520Mi
    persistence:
      data:
        enabled: true
        storageClass: "nfs-client"
        accessMode: ReadWriteOnce
        size: 5Gi
        labels:
          velero.io/exclude-from-backup: "true"
      media:
        enabled: true
        storageClass: "nfs-client"
        accessMode: ReadWriteOnce
        size: 5Gi
        labels:
          velero.io/exclude-from-backup: "true"
      consume:
        enabled: false
        type: custom
        volumeSpec:
          nfs:
            server: "${SECRET_NFS_HOST}"
            path: "${SECRET_NFS_PATH}/paperless/import"
        mountPath: /usr/src/paperless/consume
      export:
        enabled: false
        type: custom
        volumeSpec:
          nfs:
            server: "${SECRET_NFS_HOST}"
            path: "${SECRET_NFS_PATH}/paperless/export"
        mountPath: /usr/src/paperless/export

    ingress:
      main:
        enabled: true
        ingressClassName: "traefik-internal"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/icon: "note-multiple"
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: "networking-internal-ips-only@kubernetescrd"
          external-dns/internal: "true"
        hosts:
          - host: "paperless.${SECRET_LAB_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
            hosts:
              - "paperless.${SECRET_LAB_DOMAIN}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: searxng
  name: searxng
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        # ghcr.io/privau/searxng publishes no version tags, only :latest.
        - image: ghcr.io/privau/searxng:latest@sha256:a2c0b789e718ae8e62f12e0f48fa2f8c7e4f1f7dd0e47eedfbf7273a1500cfdc
          name: searxng
          env:
            - name: BASE_URL
              value: "https://search.${SECRET_LAB_DOMAIN}"
            - name: NAME
              value: "SearXNG"
            - name: IMAGE_PROXY
              value: "true"
            - name: DUCKDUCKGO_DEFAULT
              value: "true"
            - name: SEARXNG_SETTINGS_PATH
              value: /etc/searxng/settings.yml
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
            - name: data
              mountPath: /var/cache/searxng
      volumes:
        - name: config
          configMap:
            name: searxng-settings
        - name: data
          emptyDir: {}
      restartPolicy: Always

---
# Providers/applications for services that have no folder in this repo
# (Proxmox, Home Assistant, Tailscale, ...).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-external
  namespace: default
data:
  external.yaml: |
    version: 1
    metadata:
      name: External applications (gitops)
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: "${SECRET_LAB_DOMAIN}"
        attrs:
          access_token_validity: hours=24
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          basic_auth_enabled: false
          cookie_domain: ${SECRET_LAB_DOMAIN}
          external_host: https://auth.${SECRET_LAB_DOMAIN}
          intercept_header_auth: true
          internal_host_ssl_validation: true
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_domain
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: Proxy outpost']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: Application Entitlements']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''openid''']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''email''']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''profile''']]
          refresh_token_validity: days=30
      - model: authentik_core.group
        state: created
        identifiers:
          name: DevOps
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Provider for Proxmox
        attrs:
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          client_id: GFltiIEdcpc2xTtRZI8jq1Lc8FoWWIFgukyl04yl
          client_type: confidential
          grant_types:
            - authorization_code
            - hybrid
            - implicit
            - client_credentials
            - password
            - urn:ietf:params:oauth:grant-type:device_code
            - refresh_token
          include_claims_in_id_token: true
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          issuer_mode: per_provider
          logout_method: backchannel
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''offline_access''']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''openid''']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''email''']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''profile''']]
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://pve01.lab.${SECRET_LAB_DOMAIN}:8006
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://pve02.lab.${SECRET_LAB_DOMAIN}:8006
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://pve03.lab.${SECRET_LAB_DOMAIN}:8006
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://pbs.lab.${SECRET_LAB_DOMAIN}:8007
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://pbs2.lab.${SECRET_LAB_DOMAIN}:8007
          refresh_token_threshold: seconds=0
          refresh_token_validity: days=30
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          sub_mode: hashed_user_id
      - model: authentik_core.application
        state: present
        identifiers:
          slug: proxmox
        attrs:
          meta_hide: false
          name: Proxmox
          open_in_new_tab: false
          policy_engine_mode: any
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for Proxmox]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, proxmox]]
          order: 0
          group: !Find [authentik_core.group, [name, DevOps]]
        attrs:
          enabled: true
          negate: false
          failure_result: false
          timeout: 30
      - model: authentik_core.group
        state: created
        identifiers:
          name: Teslamate
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Provider for Home Assistant
        attrs:
          access_token_validity: hours=720
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          basic_auth_enabled: false
          external_host: https://hass.${SECRET_LAB_DOMAIN}
          intercept_header_auth: true
          internal_host_ssl_validation: true
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: Proxy outpost']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: Application Entitlements']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''openid''']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''email''']]
            - !Find [authentik_providers_oauth2.scopemapping, [name, 'authentik default OAuth Mapping: OpenID ''profile''']]
          refresh_token_validity: days=30
      - model: authentik_core.application
        state: present
        identifiers:
          slug: home-assistant
        attrs:
          meta_hide: false
          name: Home Assistant
          open_in_new_tab: false
          policy_engine_mode: any
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Provider for Home Assistant]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, home-assistant]]
          order: 0
          group: !Find [authentik_core.group, [name, Teslamate]]
        attrs:
          enabled: true
          negate: false
          failure_result: false
          timeout: 30
      # Retired 2026-08-16. Prune these entries once applied.
      - model: authentik_policies.policybinding
        state: absent
        identifiers:
          target: !Find [authentik_core.application, [slug, hermes-dashboard]]
          order: 0
          user: !Find [authentik_core.user, [username, yoyostile]]
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: hermes-dashboard
      - model: authentik_providers_oauth2.oauth2provider
        state: absent
        identifiers:
          name: Hermes dashboard

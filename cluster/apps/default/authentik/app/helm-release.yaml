---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: default
spec:
  interval: 5m
  values:
    authentik:
      web:
        # Set as an env var, so it is read-only in System > Settings. Optional
        # in 2026.8 but required from 2026.11; OIDC redirect URIs and e-mail
        # links are built from it.
        base_url: https://auth.${SECRET_LAB_DOMAIN}
    blueprints:
      # These ConfigMaps are shipped with this Kustomization.
      configMaps:
        - authentik-blueprint-external
        - authentik-blueprint-outpost
      secrets:
        - authentik-blueprint-identity
    worker:
      # Per-app blueprints are optional, so mount them outside the chart's
      # non-optional blueprints.configMaps list.
      volumes:
        - name: bp-grafana
          configMap:
            name: authentik-blueprint-grafana
            optional: true
        - name: bp-glitchtip
          configMap:
            name: authentik-blueprint-glitchtip
            optional: true
        - name: bp-librenms
          configMap:
            name: authentik-blueprint-librenms
            optional: true
        - name: bp-mealie
          configMap:
            name: authentik-blueprint-mealie
            optional: true
        - name: bp-open-web-ui-oauth
          configMap:
            name: authentik-blueprint-open-web-ui-oauth
            optional: true
        - name: bp-paperless
          configMap:
            name: authentik-blueprint-paperless
            optional: true
        - name: bp-uptime-kuma
          configMap:
            name: authentik-blueprint-uptime-kuma
            optional: true
        - name: bp-teslamate
          configMap:
            name: authentik-blueprint-teslamate
            optional: true
        - name: bp-sabnzbd
          configMap:
            name: authentik-blueprint-sabnzbd
            optional: true
        - name: bp-zigbee2mqtt
          configMap:
            name: authentik-blueprint-zigbee2mqtt
            optional: true
        - name: bp-notgroschen
          configMap:
            name: authentik-blueprint-notgroschen
            optional: true
        - name: bp-evcc
          configMap:
            name: authentik-blueprint-evcc
            optional: true
        - name: bp-frigate
          configMap:
            name: authentik-blueprint-frigate
            optional: true
      volumeMounts:
        - name: bp-grafana
          mountPath: /blueprints/mounted/app-grafana
        - name: bp-glitchtip
          mountPath: /blueprints/mounted/app-glitchtip
        - name: bp-librenms
          mountPath: /blueprints/mounted/app-librenms
        - name: bp-mealie
          mountPath: /blueprints/mounted/app-mealie
        - name: bp-open-web-ui-oauth
          mountPath: /blueprints/mounted/app-open-web-ui-oauth
        - name: bp-paperless
          mountPath: /blueprints/mounted/app-paperless
        - name: bp-uptime-kuma
          mountPath: /blueprints/mounted/app-uptime-kuma
        - name: bp-teslamate
          mountPath: /blueprints/mounted/app-teslamate
        - name: bp-sabnzbd
          mountPath: /blueprints/mounted/app-sabnzbd
        - name: bp-zigbee2mqtt
          mountPath: /blueprints/mounted/app-zigbee2mqtt
        - name: bp-notgroschen
          mountPath: /blueprints/mounted/app-notgroschen
        - name: bp-evcc
          mountPath: /blueprints/mounted/app-evcc
        - name: bp-frigate
          mountPath: /blueprints/mounted/app-frigate
  chart:
    spec:
      # renovate: registryUrl=https://charts.goauthentik.io
      chart: authentik
      version: 2026.8.0
      sourceRef:
        kind: HelmRepository
        name: authentik-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: authentik-values

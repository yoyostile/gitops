---
# Same host as the public ingress on purpose: internal DNS resolves auth.* to
# traefik-internal, so in-cluster OIDC clients reach Authentik without hairpinning
# through Cloudflare (which 403s server-side JWKS fetches). Keeps a single OIDC issuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-internal
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: networking-internal-ips-only@kubernetescrd
    external-dns/internal: "true"
spec:
  ingressClassName: traefik-internal
  tls:
    - secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
      hosts:
        - auth.${SECRET_LAB_DOMAIN}
  rules:
    - host: auth.${SECRET_LAB_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  name: http

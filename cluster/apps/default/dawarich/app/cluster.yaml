---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-db
  namespace: default
spec:
  imageName: ghcr.io/cloudnative-pg/postgis:17
  instances: 1

  bootstrap:
    initdb:
      database: dawarich
      owner: dawarich
      secret:
        name: dawarich-db-secret
      postInitTemplateSQL:
        - CREATE EXTENSION postgis;
        - CREATE EXTENSION postgis_topology;
        - CREATE EXTENSION fuzzystrmatch;
        - CREATE EXTENSION postgis_tiger_geocoder;
  storage:
    storageClass: "proxmox-data-ext4"
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-store

  # Sized from 14d of usage: p90 297Mi / 35m, peak 991Mi. No CPU limit — CPU is
  # compressible, so a limit throttles even on an idle node.
  resources:
    requests:
      memory: "352Mi"
      cpu: "50m"
    limits:
      memory: "1216Mi"

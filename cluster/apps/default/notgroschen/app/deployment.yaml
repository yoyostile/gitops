---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notgroschen
  namespace: default
  labels:
    app: notgroschen
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notgroschen
  template:
    metadata:
      labels:
        app: notgroschen
    spec:
      imagePullSecrets:
        - name: global-docker-config
      containers:
        - name: notgroschen
          image: ghcr.io/yoyostile/notgroschen:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          # SOLID_QUEUE_IN_PUMA is truthy whenever present; remove it to disable.
          envFrom:
            - secretRef:
                name: notgroschen-secrets
          env:
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # notgroschen:rebuild sets the memory ceiling.
              memory: "2Gi"
              cpu: "1"
          startupProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

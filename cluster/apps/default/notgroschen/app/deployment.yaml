---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notgroschen
  namespace: default
  labels:
    app: notgroschen
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notgroschen
  template:
    metadata:
      labels:
        app: notgroschen
    spec:
      imagePullSecrets:
        - name: global-docker-config
      containers:
        - name: notgroschen
          image: ghcr.io/yoyostile/notgroschen:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          # All app config comes from the secret: DATABASE_URL,
          # SECRET_KEY_BASE, INGEST_TOKEN, LLM_BASE_URL, LLM_API_KEY,
          # LLM_MODEL, SOLID_QUEUE_IN_PUMA. NB: SOLID_QUEUE_IN_PUMA is
          # truthy when PRESENT with any non-empty value — to disable it,
          # the key must be removed from the secret, not set to "false".
          envFrom:
            - secretRef:
                name: notgroschen-secrets
          env:
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # Serving needs ~260Mi; the ceiling is set by notgroschen:rebuild,
              # which OOMKilled at 768Mi once it grew to derive balances and
              # tags on top of flow types and merchants over 23k bookings in
              # one pipeline. The 21MB plist parse at ingest is the other peak.
              memory: "2Gi"
              cpu: "1"
          startupProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 80
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

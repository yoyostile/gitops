---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: psql-notgroschen
  namespace: default
spec:
  instances: 1

  # Small single-user database; allow CPU bursts.
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"

  # CNPG initdb defaults apply; create the role and database manually.

  # Table grants are not declarative in CNPG; notgroschen applies them.
  # Dashboard design notes live in the notgroschen repo.
  managed:
    roles:
      - name: grafana_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: 6
        comment: Grafana finance dashboards, column-level SELECT only
        passwordSecret:
          name: notgroschen-grafana-ro

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        # serverName defaults to the cluster name, isolating backup paths.
        barmanObjectName: cnpg-store

  storage:
    storageClass: "proxmox-data-ext4"
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi

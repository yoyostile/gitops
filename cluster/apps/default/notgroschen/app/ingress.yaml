---
# Middleware applies per Ingress, so the bearer-authenticated API uses a
# separate router from the Authentik-protected UI.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notgroschen
  namespace: default
  annotations:
    hajimari.io/appName: "notgroschen"
    hajimari.io/enable: "true"
    hajimari.io/icon: "piggy-bank"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "networking-internal-ips-only@kubernetescrd,networking-authentik@kubernetescrd"
    external-dns/internal: "true"
spec:
  ingressClassName: "traefik-internal"
  tls:
    - hosts:
        - "notgroschen.${SECRET_LAB_DOMAIN}"
      secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
  rules:
    - host: "notgroschen.${SECRET_LAB_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notgroschen
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notgroschen-api
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    # API callers use INGEST_TOKEN instead of browser SSO.
    traefik.ingress.kubernetes.io/router.middlewares: "networking-internal-ips-only@kubernetescrd"
    external-dns/internal: "true"
spec:
  ingressClassName: "traefik-internal"
  tls:
    - hosts:
        - "notgroschen.${SECRET_LAB_DOMAIN}"
      secretName: "${SECRET_LAB_DOMAIN/./-}-tls"
  rules:
    - host: "notgroschen.${SECRET_LAB_DOMAIN}"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: notgroschen
                port:
                  name: http
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: notgroschen
                port:
                  name: http

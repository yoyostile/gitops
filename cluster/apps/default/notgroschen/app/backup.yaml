---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: psql-notgroschen-backup
  namespace: default
spec:
  immediate: true
  cluster:
    name: psql-notgroschen
  # Offset by 30min from psql-cluster-backup ('0 0 */12 * * *') so the two
  # base backups don't hit the object store at the same moment.
  schedule: "0 30 */12 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-managed-config
  namespace: hermes
data:
  config.yaml: |
    providers:
      bifrost:
        api: http://bifrost.default.svc.cluster.local:8080/v1
        api_key: __BIFROST_VK__
        transport: chat_completions
        default_model: openrouter/anthropic/claude-sonnet-4.6
        context_length: 200000
    model:
      provider: custom:bifrost
      default: openrouter/anthropic/claude-sonnet-4.6
    agent:
      # Avoid injecting reasoning_effort into the Chat Completions proxy path;
      # the selected Claude model applies its own adaptive default.
      reasoning_effort: none
    security:
      redact_secrets: true
    terminal:
      backend: local
      cwd: /opt/data
      timeout: 180
      home_mode: profile
    skills:
      guard_agent_created: true
      write_approval: true
    tool_loop_guardrails:
      hard_stop_enabled: true
      hard_stop_after:
        exact_failure: 5
        idempotent_no_progress: 5
    compression:
      enabled: true
      threshold: 0.5

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    priorityClassName: system-cluster-critical
    web:
      # Without an authentication config the UI stays read-only, since actions
      # need an authenticated user. authentik forward auth gates the Ingress.
      enabled: true
      networkPolicy:
        # flux-system runs without NetworkPolicies, like networkPolicy: false
        # in the FluxInstance.
        create: false

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-rbd
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ceph-csi-rbd
      version: 3.18.2
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    csiConfig:
      - clusterID: "${SECRET_CEPH_CLUSTER_ID}"
        monitors:
          - "${SECRET_CEPH_MON_1}"
          - "${SECRET_CEPH_MON_2}"
          - "${SECRET_CEPH_MON_3}"
        rbd:
          mirrorDaemonCount: 1

    storageClass:
      create: true
      name: ceph-rbd
      annotations:
        storageclass.kubernetes.io/is-default-class: "false"
      clusterID: "${SECRET_CEPH_CLUSTER_ID}"
      pool: "k3s"
      imageFeatures: "layering"
      fstype: ext4
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      mountOptions: []
      provisionerSecret: ceph-rbd-secret
      provisionerSecretNamespace: kube-system
      controllerExpandSecret: ceph-rbd-secret
      controllerExpandSecretNamespace: kube-system
      controllerPublishSecret: ceph-rbd-secret
      controllerPublishSecretNamespace: kube-system
      nodeStageSecret: ceph-rbd-secret
      nodeStageSecretNamespace: kube-system

    secret:
      create: false
      name: ceph-rbd-secret
      userID: admin
      userKey: ""

    CSIDriver:
      fsGroupPolicy: "File"
      seLinuxMount: true

    nodeplugin:
      plugin:
        resources:
          requests:
            cpu: 10m
            memory: 192Mi
          limits:
            memory: 320Mi
      registrar:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    provisioner:
      provisioner:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 160Mi
      attacher:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 160Mi
      resizer:
        resources:
          requests:
            cpu: 10m
            memory: 80Mi
          limits:
            memory: 128Mi
      snapshotter:
        resources:
          requests:
            cpu: 10m
            memory: 80Mi
          limits:
            memory: 128Mi

  # The chart reuses nodeplugin.plugin.resources for both liveness-prometheus
  # containers and the provisioner's csi-rbdplugin and csi-rbdplugin-controller,
  # which need far less than the node plugin.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: ceph-csi-rbd-nodeplugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: ceph-csi-rbd-nodeplugin
              spec:
                template:
                  spec:
                    containers:
                      - name: liveness-prometheus
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            memory: 96Mi
          - target:
              kind: Deployment
              name: ceph-csi-rbd-provisioner
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ceph-csi-rbd-provisioner
              spec:
                template:
                  spec:
                    containers:
                      - name: csi-rbdplugin
                        resources:
                          requests:
                            cpu: 10m
                            memory: 48Mi
                          limits:
                            memory: 192Mi
                      - name: csi-rbdplugin-controller
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            memory: 112Mi
                      - name: liveness-prometheus
                        resources:
                          requests:
                            cpu: 10m
                            memory: 24Mi
                          limits:
                            memory: 64Mi

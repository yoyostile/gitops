---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-rbd
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: ceph-csi-rbd
      version: 3.17.1
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    csiConfig:
      - clusterID: "${SECRET_CEPH_CLUSTER_ID}"
        monitors:
          - "${SECRET_CEPH_MON_1}"
          - "${SECRET_CEPH_MON_2}"
          - "${SECRET_CEPH_MON_3}"
        rbd:
          mirrorDaemonCount: 1

    storageClass:
      create: true
      name: ceph-rbd
      annotations:
        storageclass.kubernetes.io/is-default-class: "false"
      clusterID: "${SECRET_CEPH_CLUSTER_ID}"
      pool: "k3s"
      imageFeatures: "layering"
      fstype: ext4
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      mountOptions: []
      provisionerSecret: ceph-rbd-secret
      provisionerSecretNamespace: kube-system
      controllerExpandSecret: ceph-rbd-secret
      controllerExpandSecretNamespace: kube-system
      controllerPublishSecret: ceph-rbd-secret
      controllerPublishSecretNamespace: kube-system
      nodeStageSecret: ceph-rbd-secret
      nodeStageSecretNamespace: kube-system

    secret:
      create: false
      name: ceph-rbd-secret
      userID: admin
      userKey: ""

    CSIDriver:
      fsGroupPolicy: "File"
      seLinuxMount: true

    # Sized from 30 days of observed usage. nodeplugin.plugin.resources also
    # backs the provisioner's csi-rbdplugin, csi-rbdplugin-controller and both
    # liveness-prometheus containers, so it is sized for the largest of them.
    nodeplugin:
      plugin:
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 384Mi
      registrar:
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 96Mi

    provisioner:
      provisioner:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi
      attacher:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi
      resizer:
        resources:
          requests:
            cpu: 15m
            memory: 96Mi
          limits:
            memory: 192Mi
      snapshotter:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi

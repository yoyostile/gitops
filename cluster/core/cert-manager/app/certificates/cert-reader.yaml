---
# Lets pve01's ~/.hack/refresh_*cert.sh pull these certs with a token
# instead of SSHing to a control plane.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-reader
  namespace: networking
---
apiVersion: v1
kind: Secret
metadata:
  name: cert-reader-token
  namespace: networking
  annotations:
    kubernetes.io/service-account.name: cert-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-reader
  namespace: networking
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - pve-lab-${SECRET_LAB_DOMAIN/./-}-tls
      - unifi-lan-${SECRET_LAB_DOMAIN/./-}-tls
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-reader
  namespace: networking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-reader
subjects:
  - kind: ServiceAccount
    name: cert-reader
    namespace: networking

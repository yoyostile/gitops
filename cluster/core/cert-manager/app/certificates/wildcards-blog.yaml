---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${SECRET_BLOG_DOMAIN/./-}-wildcard"
  namespace: networking
spec:
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  # Avoid the ingress-shim secret name, which conflicts during reflection.
  secretName: "${SECRET_BLOG_DOMAIN/./-}-wildcard-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "${SECRET_BLOG_DOMAIN}"
  dnsNames:
    - "${SECRET_BLOG_DOMAIN}"
    - "*.${SECRET_BLOG_DOMAIN}"
    - "*.lab.${SECRET_BLOG_DOMAIN}"

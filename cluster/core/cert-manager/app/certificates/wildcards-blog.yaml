---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "${SECRET_BLOG_DOMAIN/./-}-wildcard"
  namespace: networking
spec:
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  # Deliberately not "${SECRET_BLOG_DOMAIN/./-}-tls": that name is already taken
  # by the ingress-shim cert on the heck-sh app in the default namespace, and
  # auto-reflection would fight it for ownership.
  secretName: "${SECRET_BLOG_DOMAIN/./-}-wildcard-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "${SECRET_BLOG_DOMAIN}"
  dnsNames:
    - "${SECRET_BLOG_DOMAIN}"
    - "*.${SECRET_BLOG_DOMAIN}"
    - "*.lab.${SECRET_BLOG_DOMAIN}"

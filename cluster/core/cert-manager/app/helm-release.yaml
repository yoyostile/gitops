---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: cert-manager
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: false
    replicaCount: 1
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=https://1.1.1.1/dns-query
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 192Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
        limits:
          memory: 128Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
        limits:
          memory: 128Mi

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: mariadb-operator
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: mariadb-operator
    namespace: mariadb-operator
  values:
    resources:
      requests:
        cpu: 10m
        memory: 160Mi
      limits:
        memory: 256Mi
    webhook:
      cert:
        certManager:
          enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 112Mi

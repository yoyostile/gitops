---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: mariadb-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: mariadb-operator
      version: 26.6.0
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator-charts
        namespace: flux-system
  values:
    # Resources sized from 30 days of observed usage.
    webhook:
      cert:
        certManager:
          enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        memory: 320Mi

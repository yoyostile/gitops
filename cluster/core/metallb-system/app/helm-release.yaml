---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://metallb.github.io/metallb
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: false
    # frr-k8s became the default backend in chart 0.16.1; disable it explicitly
    # to keep the existing legacy FRR (BGP) mode. The two are mutually exclusive.
    frrk8s:
      enabled: false
    # Sized from 30 days of observed usage.
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
    speaker:
      resources:
        requests:
          cpu: 15m
          memory: 128Mi
        limits:
          memory: 192Mi
      frr:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi
      frrMetrics:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi
      reloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 48Mi

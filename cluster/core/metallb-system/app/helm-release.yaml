---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: metallb
    namespace: metallb-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: false
    # frr-k8s became the default backend in chart 0.16.1; disable it explicitly
    # to keep the existing legacy FRR (BGP) mode. The two are mutually exclusive.
    frrk8s:
      enabled: false
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 112Mi
        limits:
          memory: 192Mi
    speaker:
      resources:
        requests:
          cpu: 10m
          memory: 112Mi
        limits:
          memory: 192Mi
      frr:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 80Mi
      frrMetrics:
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 96Mi
      reloader:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi

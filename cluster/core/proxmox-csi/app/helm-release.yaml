---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi
  namespace: kube-system
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: proxmox-csi-charts
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      clusters:
        - url: https://pve01.lab.${SECRET_LAB_DOMAIN}:8006/api2/json
          insecure: false
          token_id: "kubernetes-csi@pve!csi"
          token_secret: "${SECRET_PROXMOX_CSI_TOKEN}"
          region: lab

    # Sized from 30 days of observed usage; only the node plugin's own
    # container lacked requests, the CSI sidecars ship with chart defaults.
    node:
      plugin:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi

    storageClass:
      - name: proxmox-data-ext4
        storage: local-lvm
        reclaimPolicy: Retain
        fstype: ext4
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
        # Leave allowedTopologies unset so WaitForFirstConsumer uses the
        # scheduler-selected node's region and zone.

---
fail_fast: false
repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - args:
          - --config-file
          - .github/linters/.yamllint.yaml
        id: yamllint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # boot.cfg is upstream netboot.xyz iPXE served verbatim, and its trailing
      # whitespace is load-bearing: `set <name> ` assigns an empty string, while
      # `set <name>` with no value argument is a syntax error mid-script.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^nix/modules/netbootxyz-boot\.cfg$
      - id: end-of-file-fixer
        exclude: ^nix/modules/netbootxyz-boot\.cfg$
      - id: mixed-line-ending
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf
      - id: remove-tabs
  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
  - repo: https://github.com/k8s-at-home/sops-pre-commit
    rev: v2.1.1
    hooks:
      - id: forbid-secrets
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
